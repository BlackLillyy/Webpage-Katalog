<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="container vh-100 d-flex justify-content-center align-items-center" id="loginSection" style="display:none;">
    <div class="card-custom col-md-4 col-sm-10">
      <h2 class="text-center mb-4">Login</h2>
      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-sky w-100">Login</button>
      </form>
      <p id="loginResult" class="text-center mt-3 text-danger"></p>
    </div>
  </div>

  <div class="container vh-100 d-flex justify-content-center align-items-center" id="profileSection" style="display:none;">
    <div class="card-custom" style="max-width: 500px;">
      <h2 class="text-center mb-4">Profile</h2>
      <div class="d-flex gap-2 mb-3">
        <button id="getProfileBtn" class="btn btn-sky flex-fill">Lihat Profil</button>
        <button id="logoutBtn" class="btn btn-outline-danger flex-fill">Logout</button>
      </div>
      <pre id="profileResult">Klik "Lihat Profil" untuk memuat data...</pre>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
  </body>
  </html>
